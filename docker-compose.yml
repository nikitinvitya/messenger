services:
  postgres-db:
    image: postgres:16-alpine
    container_name: messenger-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: messenger_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  messenger-server:
    build: ./server
    container_name: messenger-app
    ports:
      - "8080:8080"
    environment:
      - DB_SOURCE=postgres://admin:admin@postgres-db:5432/messenger_db?sslmode=disable
    depends_on:
      - postgres-db
    volumes:
      - ./server/uploads:/app/uploads

volumes:
  postgres-data: